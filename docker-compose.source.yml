services:
  db:
    image: postgres:16-alpine
    container_name: belgium-staatsrekening-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: staatsrekening
      POSTGRES_PASSWORD: staatsrekening
      POSTGRES_DB: staatsrekening
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - belgium_staatsrekening_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staatsrekening -d staatsrekening"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: belgium-staatsrekening-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://staatsrekening:staatsrekening@db:5432/staatsrekening?schema=public"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the shell environment or a .env file before deploying}"
    ports:
      - "127.0.0.1:3140:3000"

volumes:
  belgium_staatsrekening_pgdata:
